[package]
name = "mesh-jawn"
description = "A Meshtastic radio-to-NATS relay and bot"
version = "0.0.1"
authors = ["Chris Becker <chris@becker.am>"]
edition = "2024"
homepage = "https://cbme.sh"
repository = "https://github.com/cbeck527/mesh-jawn"
license = "MIT"
keywords = ["meshtastic", "nats", "philly", "jawn"]

[dependencies]
meshtastic = { path = "../meshtastic-rust", features = ["tokio"] }
tokio = { version = "1.48.0", features = ["full"] }
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
rand = "0.8"
indoc = "2.0.7"
chrono = "0.4.42"
ureq = { version = "3.1.2", features = ["json"] }
async-nats = "0.38"
futures = "0.3"
