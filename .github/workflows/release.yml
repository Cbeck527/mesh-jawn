name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  REGISTRY: ghcr.io
  IMAGE_NAME: cbeck527/mesh-jawn

jobs:
  # Run CI checks first
  ci-checks:
    name: CI Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache target directory
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Run tests
        run: cargo test --verbose

      - name: Run cargo check
        run: cargo check --verbose

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Check formatting
        run: cargo fmt --all -- --check

  # Build Linux binaries (x86_64, ARM64, ARMv7)
  build-linux:
    name: Build Linux Binaries
    runs-on: ubuntu-latest
    needs: ci-checks
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - armv7-unknown-linux-gnueabihf

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build binary
        run: cross build --release --target ${{ matrix.target }}

      - name: Rename binary
        run: |
          TARGET="${{ matrix.target }}"
          case "$TARGET" in
            x86_64-unknown-linux-gnu)
              ARCH="x86_64"
              ;;
            aarch64-unknown-linux-gnu)
              ARCH="arm64"
              ;;
            armv7-unknown-linux-gnueabihf)
              ARCH="armv7"
              ;;
          esac
          cp target/${{ matrix.target }}/release/mesh-jawn mesh-jawn-linux-$ARCH

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mesh-jawn-linux-${{ matrix.target }}
          path: mesh-jawn-linux-*

  # Build macOS binaries (x86_64, ARM64)
  build-macos:
    name: Build macOS Binaries
    runs-on: macos-latest
    needs: ci-checks
    strategy:
      matrix:
        target:
          - x86_64-apple-darwin
          - aarch64-apple-darwin

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename binary
        run: |
          TARGET="${{ matrix.target }}"
          case "$TARGET" in
            x86_64-apple-darwin)
              ARCH="x86_64"
              ;;
            aarch64-apple-darwin)
              ARCH="arm64"
              ;;
          esac
          cp target/${{ matrix.target }}/release/mesh-jawn mesh-jawn-macos-$ARCH

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mesh-jawn-macos-${{ matrix.target }}
          path: mesh-jawn-macos-*

  # Build Windows binary (x86_64)
  build-windows:
    name: Build Windows Binary
    runs-on: windows-latest
    needs: ci-checks

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build binary
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Rename binary
        run: cp target/x86_64-pc-windows-msvc/release/mesh-jawn.exe mesh-jawn-windows-x86_64.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mesh-jawn-windows-x86_64
          path: mesh-jawn-windows-x86_64.exe

  # Build multi-arch Docker image
  build-docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: ci-checks
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Create GitHub Release with all binaries
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-linux, build-macos, build-windows, build-docker]
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display artifact structure
        run: ls -R artifacts

      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/**/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
